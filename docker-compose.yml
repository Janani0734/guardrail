# Default:   docker compose up -d                 -> PostgreSQL + Redis only (run backend/frontend locally)
# Full stack: docker compose --profile full up -d --build  -> also API (auto-migrates) + Trusted Executor (:8100) + dashboard
name: guardrail

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: guardrail
      POSTGRES_PASSWORD: guardrail
      POSTGRES_DB: guardrail
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U guardrail -d guardrail"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6379:6379"]
    volumes: ["redisdata:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    profiles: ["full"]
    build: ./backend
    environment:
      DATABASE_URL: postgresql+asyncpg://guardrail:guardrail@postgres:5432/guardrail
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:-dev-only-jwt-secret-change-me-0123456789abcdef}
      API_KEY_PEPPER: ${API_KEY_PEPPER:-dev-only-api-key-pepper-change-me-0123456789}
      CORS_ORIGINS: '["http://localhost:3000"]'
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    ports: ["8000:8000"]

  executor:
    profiles: ["full"]
    build: ./backend
    command: ["uvicorn", "executor.main:app", "--host", "0.0.0.0", "--port", "8100"]
    environment:
      GUARDRAIL_URL: http://backend:8000
      REDIS_URL: redis://redis:6379/1   # separate Redis database from GuardRail's own state
    depends_on:
      backend: { condition: service_started }
      redis: { condition: service_healthy }
    ports: ["8100:8100"]

  frontend:
    profiles: ["full"]
    build: ./frontend
    environment:
      BACKEND_URL: http://backend:8000
    depends_on: [backend]
    ports: ["3000:3000"]

volumes:
  pgdata:
  redisdata:
